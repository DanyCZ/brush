name: Build brush-c for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      # Standard runners have ~7GB RAM; this workspace's dependency tree
      # (wgpu/burn/cubecl) OOM'd rustc locally on a machine with more RAM than
      # that. Extra swap is a well-known, low-risk mitigation for exactly this.
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/extra-swapfile
          sudo chmod 600 /mnt/extra-swapfile
          sudo mkswap /mnt/extra-swapfile
          sudo swapon /mnt/extra-swapfile
          free -h

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2"
          shared-key: "brush-c-android"
          cache-workspace-crates: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build brush-c for arm64-v8a
        working-directory: apps/brush-c
        env:
          # Cap parallel rustc jobs to limit peak memory, at the cost of wall-clock time.
          CARGO_BUILD_JOBS: "2"
          # Rust cdylibs get no DT_SONAME by default. Without one, a consumer that links against
          # this .so by path (rather than -l search) has ld.lld fall back to embedding that raw
          # path as the DT_NEEDED entry in the *caller's* binary - fine on the build machine,
          # meaningless on-device. Setting this here fixes it at the source, in the file itself,
          # rather than needing every consumer to work around a missing soname.
          RUSTFLAGS: "-C link-arg=-Wl,-soname,libbrush_c.so"
        run: cargo ndk -t arm64-v8a build --release

      - name: Upload .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: libbrush_c-arm64-v8a
          path: target/aarch64-linux-android/release/libbrush_c.so
